name: integration

on:
  push:
    branches: [master]
  pull_request:

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      JWT_SECRET: ci-test-secret
      JWT_ISSUER: ground-graph
      JWT_AUDIENCE: ground-graph-api
      POSTGRES_USER: groundgraph
      POSTGRES_PASSWORD: change-me-local-only
      POSTGRES_DB: groundgraph
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: change-me-local-only
      S3_ACCESS_KEY: change-me-local-only
      S3_SECRET_KEY: change-me-local-only
      E2E_API_URL: http://127.0.0.1:8080
      DATABASE_URL: postgresql://groundgraph:change-me-local-only@127.0.0.1:5432/groundgraph

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start stack
        run: docker compose up -d postgres neo4j minio minio-init otel-collector otel-probe phoenix prometheus grafana api

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Run stack tests
        run: pnpm test:stack

      - name: Shutdown stack
        if: always()
        run: docker compose down -v --remove-orphans

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      JWT_SECRET: ci-test-secret
      JWT_ISSUER: ground-graph
      JWT_AUDIENCE: ground-graph-api
      POSTGRES_USER: groundgraph
      POSTGRES_PASSWORD: change-me-local-only
      POSTGRES_DB: groundgraph
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: change-me-local-only
      S3_ACCESS_KEY: change-me-local-only
      S3_SECRET_KEY: change-me-local-only
      E2E_API_URL: http://127.0.0.1:8080
      DATABASE_URL: postgresql://groundgraph:change-me-local-only@127.0.0.1:5432/groundgraph

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start stack
        run: docker compose up -d postgres neo4j minio minio-init otel-collector otel-probe phoenix prometheus grafana api

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Generate auth token
        run: |
          E2E_AUTH_TOKEN=$(node --input-type=module -e "import { SignJWT } from 'jose'; const secret = new TextEncoder().encode(process.env.JWT_SECRET); const token = await new SignJWT({ tenantId: '00000000-0000-4000-8000-000000000001', principalId: '00000000-0000-4000-8000-0000000000a1', roles: ['tester'] }).setProtectedHeader({ alg: 'HS256' }).setIssuedAt().setIssuer(process.env.JWT_ISSUER).setAudience(process.env.JWT_AUDIENCE).setExpirationTime('1h').sign(secret); console.log(token);")
          echo "E2E_AUTH_TOKEN=$E2E_AUTH_TOKEN" >> "$GITHUB_ENV"

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Shutdown stack
        if: always()
        run: docker compose down -v --remove-orphans
