global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'phoenix'
    static_configs:
      - targets: ['phoenix:9090']

  - job_name: 'ground-graph-ts'
    static_configs:
      - targets: ['host.docker.internal:8888']
    metrics_path: '/metrics'
