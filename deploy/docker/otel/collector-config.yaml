receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 1s
    limit_percentage: 80

  transform:
    trace_statements:
      - context: span
        statements:
          - replace_pattern(attributes["net.peer.name"], ".*", "redacted")
          - delete_key(attributes, "db.system")
          - delete_key(attributes, "db.name")

exporters:
  debug:
    verbosity: detailed

  otlp/http:
    endpoint: http://phoenix:6006/v1/traces
    tls:
      insecure: true

  prometheus:
    endpoint: "0.0.0.0:8889"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp/http]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]

  extensions:
    health_check:
      endpoint: 0.0.0.0:13133
